apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bist.fullname" . }}-backend
  labels:
    {{- include "bist.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "bist.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "bist.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "bist.fullname" . }}-backend
      containers:
        - name: backend
          image: {{ include "bist.image" .Values.images.backend | quote }}
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.application.existingSecret }}
                  key: {{ .Values.application.databaseKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.application.existingSecret }}
                  key: {{ .Values.application.openaiApiKey }}
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.application.existingSecret }}
                  key: {{ .Values.application.openaiBaseUrlKey }}
            - name: REDIS_URL
              value: {{ include "bist.redisUrl" . | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- if or .Values.storage.existingClaim .Values.storage.hostPath }}
          volumeMounts:
            - name: bist-data
              mountPath: /app/data
          {{- end }}
      {{- if or .Values.storage.existingClaim .Values.storage.hostPath }}
      volumes:
        - name: bist-data
          {{- if .Values.storage.hostPath }}
          hostPath:
            path: {{ .Values.storage.hostPath }}
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim }}
          {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bist.fullname" . }}-backend
  labels:
    {{- include "bist.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "bist.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8765
      targetPort: http
