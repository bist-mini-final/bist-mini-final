name: bist-prefect

services:
  prefect-db:
    image: postgres:16-alpine
    container_name: bist-prefect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect_db_data:/var/lib/postgresql/data
    networks:
      - batch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 5s
      timeout: 5s
      retries: 12

  prefect-server:
    image: prefecthq/prefect:3.8.3-python3.11
    container_name: bist-prefect-server
    restart: unless-stopped
    depends_on:
      prefect-db:
        condition: service_healthy
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@prefect-db:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - batch
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:4200/api/health', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  prefect-worker:
    build:
      context: ../..
      dockerfile: deploy/prefect/Dockerfile.worker
    image: bist-prefect-docker-worker:local
    container_name: bist-prefect-worker
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    command:
      - prefect
      - worker
      - start
      - --pool
      - bist-docker
      - --type
      - docker
      - --limit
      - "4"
      - --with-healthcheck
      - --no-create-pool-if-not-found
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_WORKER_QUERY_SECONDS: "1"
      PREFECT_WORKER_PREFETCH_SECONDS: "10"
      PREFECT_WORKER_ENABLE_CANCELLATION: "true"
      PREFECT_WORKER_CANCELLATION_POLL_SECONDS: "5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - batch
    stop_grace_period: 30s

volumes:
  prefect_db_data:

networks:
  batch:
    external: true
    name: bist-batch
