apiVersion: v1
kind: Service
metadata:
  name: bist-pgvector
  namespace: bist-batch
spec:
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bist-pgvector-local
  namespace: bist-batch
  labels:
    kubernetes.io/service-name: bist-pgvector
addressType: __ADDRESS_TYPE__
ports:
  - name: postgresql
    protocol: TCP
    port: 5432
endpoints:
  - addresses:
      - __DATABASE_ENDPOINT__
    conditions:
      ready: true
