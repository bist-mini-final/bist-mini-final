apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: frontend-ui
    app.kubernetes.io/part-of: bist-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-ui
        app.kubernetes.io/part-of: bist-mini
    spec:
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ui
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: frontend-ui
    app.kubernetes.io/part-of: bist-mini
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: frontend-ui
