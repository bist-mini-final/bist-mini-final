apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: excel-ingestion
  namespace: bist-batch
  annotations:
    bist.ai/connection-hash: __CONNECTION_HASH__
  labels:
    app.kubernetes.io/name: workflow-worker
    app.kubernetes.io/part-of: bist-mini
spec:
  pollingInterval: 2
  minReplicaCount: 0
  maxReplicaCount: __MAX_REPLICAS__
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  rollout:
    strategy: gradual
  scalingStrategy:
    strategy: accurate
    pendingPodConditions:
      - Ready
      - PodScheduled
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: 21600
    ttlSecondsAfterFinished: 600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: workflow-worker
          app.kubernetes.io/part-of: bist-mini
          bist.ai/queue: __QUEUE__
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        containers:
          - name: worker
            image: __IMAGE__
            imagePullPolicy: IfNotPresent
            args: ["--queue", "__QUEUE__"]
            env:
              - name: WORKFLOW_QUEUE
                value: __QUEUE__
              - name: KUBERNETES_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: PGVECTOR_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: PGVECTOR_URL
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_API_KEY
              - name: OPENAI_BASE_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_BASE_URL
              - name: DB_POOL_MIN_SIZE
                value: "1"
              - name: DB_POOL_MAX_SIZE
                value: "4"
            resources:
              requests:
                cpu: __CPU_REQUEST__
                memory: __MEMORY_REQUEST__
              limits:
                cpu: __CPU_LIMIT__
                memory: __MEMORY_LIMIT__
            volumeMounts:
              - name: bist-data
                mountPath: /app/data
        volumes:
          - name: bist-data
            hostPath:
              path: /mnt/bist-data
              type: Directory
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: PGVECTOR_URL
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
        query: >-
          SELECT COUNT(*) FROM workflow_runs
          WHERE queue_name = '__QUEUE__'
            AND cancel_requested = FALSE
            AND ((status = 'queued' AND available_at <= NOW())
              OR (status = 'running' AND (heartbeat_at IS NULL
                OR heartbeat_at < NOW() - (180 * INTERVAL '1 second'))))
