apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/part-of: bist-mini
    spec:
      containers:
        - name: backend
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8765"]
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: PGVECTOR_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_BASE_URL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/modules
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/modules
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  type: ClusterIP
  ports:
    - port: 8765
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend-api
