apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-api-workload-reader
  namespace: bist-batch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-api-workload-reader
  namespace: bist-batch
subjects:
  - kind: ServiceAccount
    name: backend-api
    namespace: bist-batch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backend-api-workload-reader
