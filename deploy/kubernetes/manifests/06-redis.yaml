apiVersion: apps/v1
kind: Deployment
metadata:
  name: bist-redis
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: bist-redis
    app.kubernetes.io/part-of: bist-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bist-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bist-redis
        app.kubernetes.io/part-of: bist-mini
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bist-redis
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: bist-redis
    app.kubernetes.io/part-of: bist-mini
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bist-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
