apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: __NAME__
  namespace: bist-batch
  annotations:
    bist.ai/connection-hash: __CONNECTION_HASH__
  labels:
    app.kubernetes.io/name: __APP_NAME__
    app.kubernetes.io/part-of: bist-mini
spec:
  pollingInterval: 2
  minReplicaCount: 0
  maxReplicaCount: __MAX_REPLICAS__
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  rollout:
    strategy: gradual
  scalingStrategy:
    strategy: accurate
    pendingPodConditions:
      - Ready
      - PodScheduled
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
    ttlSecondsAfterFinished: 600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: __APP_NAME__
          app.kubernetes.io/part-of: bist-mini
          bist.ai/queue: __QUEUE__
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        containers:
          - name: worker
            image: __IMAGE__
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "__WORKER_MODULE__"]
__ARGS_BLOCK__
            env:
              - name: WORKFLOW_QUEUE
                value: __QUEUE__
              - name: KUBERNETES_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: PGVECTOR_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: PGVECTOR_URL
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_API_KEY
              - name: OPENAI_BASE_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_BASE_URL
              - name: DB_POOL_MIN_SIZE
                value: "1"
              - name: DB_POOL_MAX_SIZE
                value: "4"
              - name: INGESTION_SHARDS_ENABLED
                value: "true"
            resources:
              requests:
                cpu: __CPU_REQUEST__
                memory: __MEMORY_REQUEST__
              limits:
                cpu: __CPU_LIMIT__
                memory: __MEMORY_LIMIT__
__VOLUME_MOUNT_BLOCK__
__VOLUME_BLOCK__
  triggers:
    - type: postgresql
      metadata:
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
        query: >-
__QUERY_BLOCK__
      authenticationRef:
        name: bist-postgresql
