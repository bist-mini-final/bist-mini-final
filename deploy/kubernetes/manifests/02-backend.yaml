apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/part-of: bist-mini
    spec:
      serviceAccountName: backend-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: bist-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: bist-auth-env
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: PGVECTOR_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_BASE_URL
            - name: REDIS_URL
              value: redis://bist-redis:6379/0
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_ENV
              value: production
            - name: EXPOSE_API_DOCS
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: bist-data
              mountPath: /app/data
      volumes:
        - name: bist-data
          hostPath:
            path: /mnt/bist-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  type: ClusterIP
  ports:
    - port: 8765
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend-api
