apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-api
        app.kubernetes.io/part-of: bist-mini
    spec:
      serviceAccountName: backend-api
      containers:
        - name: backend
          image: bist-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: PGVECTOR_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_API_KEY
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: bist-batch-env
                  key: OPENAI_BASE_URL
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: bist-data
              mountPath: /app/data
      volumes:
        - name: bist-data
          hostPath:
            path: /mnt/bist-data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/part-of: bist-mini
spec:
  type: ClusterIP
  ports:
    - port: 8765
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: backend-api
