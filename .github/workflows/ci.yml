name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv (High-speed Python package manager with caching)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Dependencies
        run: |
          uv sync --frozen

      - name: Apply Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_flow
        run: uv run alembic upgrade head

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_flow
          INTEGRATION_DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_flow
          REDIS_URL: redis://localhost:6379/0
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key-for-testing' }}
        run: |
          uv run pytest -v --tb=short

      - name: Ruff Static Quality Check
        run: uv run ruff check modules backend jobs tests

      - name: Pyright Type Check
        run: uv run pyright

      - name: Render Kubernetes ScaledJobs
        run: |
          uv run python deploy/kubernetes/scripts/render.py \
            --max-replicas 4 \
            --connection-hash aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/bist-scaledjobs.yaml
          uv run python -c "import pathlib,yaml; docs=list(yaml.safe_load_all(pathlib.Path('/tmp/bist-scaledjobs.yaml').read_text())); assert len(docs)==4 and all(item['kind']=='ScaledJob' for item in docs)"

  frontend-unit-tests:
    name: Frontend Unit Tests & Build (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Build Frontend Bundle
        run: npm run build
