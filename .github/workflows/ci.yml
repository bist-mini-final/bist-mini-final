name: CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag_user
          POSTGRES_PASSWORD: rag_password
          POSTGRES_DB: rag_flow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv (High-speed Python package manager with caching)
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          uv pip install --system -r backend/requirements.txt

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+psycopg://rag_user:rag_password@localhost:5432/rag_flow
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'mock-key-for-testing' }}
        run: |
          pytest -v --tb=short

  frontend-unit-tests:
    name: Frontend Unit Tests & Build (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Run Frontend Unit Tests
        run: npm run test

      - name: Build Frontend Bundle
        run: npm run build
