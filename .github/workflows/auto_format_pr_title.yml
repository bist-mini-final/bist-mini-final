name: Auto Format PR Title (GPT-5.6-Luna)

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev
      - main

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  format-pr-title:
    name: Auto Format PR Title
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and Update PR Title with GPT-5.6-Luna
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LUNA_API_KEY: ${{ secrets.LUNA_API_KEY || secrets.OPENAI_API_KEY }}
          LUNA_BASE_URL: ${{ secrets.LUNA_BASE_URL || secrets.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
          LUNA_MODEL: 'gpt-5.6-luna'
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python .github/scripts/format_pr_title.py
