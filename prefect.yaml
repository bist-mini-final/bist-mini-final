name: bist-mini
prefect-version: 3.8.3

build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app

deployments:
  - name: docker
    description: Playground Excel ingestion DAG compiled to Prefect module tasks.
    entrypoint: jobs/excel_ingestion/prefect_flow.py:excel_ingestion_flow
    concurrency_limit:
      limit: 4
      collision_strategy: ENQUEUE
    parameters:
      resume_failed: false
    work_pool:
      name: bist-docker
      work_queue_name: excel-ingestion
      job_variables:
        image: bist-excel-ingestion-prefect:local
        image_pull_policy: Never
        auto_remove: true
        networks:
          - bist-batch
        stream_output: true
