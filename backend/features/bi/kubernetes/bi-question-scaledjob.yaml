apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: bi-question
  namespace: bist-batch
  labels:
    app.kubernetes.io/name: bi-question-worker
    app.kubernetes.io/part-of: bist-mini
spec:
  pollingInterval: 2
  minReplicaCount: 0
  maxReplicaCount: __MAX_REPLICAS__
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  scalingStrategy:
    strategy: accurate
    pendingPodConditions:
      - Ready
      - PodScheduled
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 600
    template:
      metadata:
        labels:
          app.kubernetes.io/name: bi-question-worker
          app.kubernetes.io/part-of: bist-mini
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 30
        containers:
          - name: worker
            image: __IMAGE__
            imagePullPolicy: IfNotPresent
            command: ["python", "-m", "backend.features.bi.question_worker_main"]
            env:
              - name: KUBERNETES_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: PGVECTOR_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: PGVECTOR_URL
              - name: OPENAI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_API_KEY
              - name: OPENAI_BASE_URL
                valueFrom:
                  secretKeyRef:
                    name: bist-batch-env
                    key: OPENAI_BASE_URL
              - name: DB_POOL_MIN_SIZE
                value: "1"
              - name: DB_POOL_MAX_SIZE
                value: "4"
            resources:
              requests:
                cpu: __CPU_REQUEST__
                memory: __MEMORY_REQUEST__
              limits:
                cpu: __CPU_LIMIT__
                memory: __MEMORY_LIMIT__
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: PGVECTOR_URL
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
        query: >-
          SELECT COUNT(*) FROM bi_questions WHERE status = 'queued'
