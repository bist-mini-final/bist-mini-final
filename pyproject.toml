[project]
name = "bist-mini-final"
version = "0.1.0"
description = "RAG Pipeline & BI Visualizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "openpyxl>=3.1.0,<4.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "docling==2.69.1",
    "torch>=2.2.0,<3.0.0",
    "transformers>=4.44.0,<5.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pyarrow>=17.0.0",
    "python-multipart>=0.0.31",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "langchain-core>=1.3.3",
    "langchain-postgres>=0.0.12",
    "sqlalchemy>=2.0.0",
    "networkx>=3.2",
    "sse-starlette>=2.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.4",
    "pyright>=1.1.411",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/bi/tests"]
pythonpath = ["."]
